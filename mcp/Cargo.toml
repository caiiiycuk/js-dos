[package]
name = "jsdos-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
futures-util = "0.3.31"
rmcp = { version = "=3.9.0", features = ["transport-io"] }
reqwest = { version = "0.12.24", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json = "1.0.145"
sha2 = "0.10.9"

[dev-dependencies]
tokio-tungstenite = "0.28.0"
tokio = { version = "1.48.0", features = ["test-util"] }

[profile.release]
lto = true
strip = true
